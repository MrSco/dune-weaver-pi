name: Dune Weaver
version: "5.0.1-mini.5"
slug: dune_weaver
description: >-
  Host for a Dune Weaver sand table (Mini fork): web UI, pattern library,
  playlists and MQTT entities. Keeps the library here and uploads patterns
  into the table's on-board cache as they are needed.
url: https://github.com/MrSco/dune-weaver-pi
arch:
  - amd64
init: false
startup: application
boot: auto
# Host networking: the table is found by mDNS and talks plain HTTP on the LAN.
host_network: true
# Sidebar panel through Home Assistant (HTTPS + HA login); the same UI is
# also reachable directly on the LAN at port 8099.
ingress: true
ingress_port: 8099
panel_icon: mdi:waves
panel_title: Dune Weaver
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Dune Weaver web UI
map:
  - share:rw
services:
  - mqtt:want
hassio_api: false
options:
  board_url: ""
  log_level: INFO
schema:
  board_url: "str?"
  log_level: list(DEBUG|INFO|WARNING|ERROR)
