    <!-- DW fork: Home Assistant ingress support. The server rewrites this tag
         to the ingress path (X-Ingress-Path); everywhere else it stays "/". -->
    <base href="/" />
    <script>
      // The app uses root-absolute URLs ('/api/...', '/ws/...', '/static/...').
      // When served under a sub-path, prefix them: requests (fetch, XHR,
      // WebSocket, EventSource) and src/href attributes, so upstream code
      // needs no per-call changes. No-op at the site root.
      (function () {
        var base = new URL(document.baseURI).pathname.replace(/\/+$/, '');
        window.__DW_BASE__ = base;
        if (!base) {
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
            });
          }
          return;
        }
        function fixPath(u) {
          return (typeof u === 'string' && u.charAt(0) === '/' && u.charAt(1) !== '/' &&
                  u.indexOf(base + '/') !== 0 && u !== base) ? base + u : u;
        }
        function fixUrl(u) {
          if (typeof u !== 'string') u = String(u);
          if (u.charAt(0) === '/' && u.charAt(1) !== '/') return fixPath(u);
          try {
            var x = new URL(u, location.href);
            if (x.host === location.host && x.pathname.indexOf(base + '/') !== 0) {
              x.pathname = base + x.pathname;
              return x.toString();
            }
          } catch (e) {}
          return u;
        }
        var origFetch = window.fetch;
        window.fetch = function (input, init) {
          if (typeof input === 'string' || input instanceof URL) input = fixUrl(input);
          return origFetch.call(this, input, init);
        };
        var origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          arguments[1] = fixUrl(url);
          return origOpen.apply(this, arguments);
        };
        function wrap(Orig) {
          if (!Orig) return Orig;
          var W = function (url, opts) {
            return opts === undefined ? new Orig(fixUrl(url)) : new Orig(fixUrl(url), opts);
          };
          W.prototype = Orig.prototype;
          ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) {
            if (k in Orig) W[k] = Orig[k];
          });
          return W;
        }
        window.WebSocket = wrap(window.WebSocket);
        window.EventSource = wrap(window.EventSource);
        function fixEl(el) {
          if (!el.getAttribute) return;
          ['src', 'href'].forEach(function (a) {
            var v = el.getAttribute(a);
            var nv = fixPath(v);
            if (v && nv !== v) el.setAttribute(a, nv);
          });
        }
        new MutationObserver(function (records) {
          records.forEach(function (r) {
            if (r.type === 'attributes') { fixEl(r.target); return; }
            r.addedNodes.forEach(function (n) {
              if (n.nodeType !== 1) return;
              fixEl(n);
              if (n.querySelectorAll) n.querySelectorAll('[src],[href]').forEach(fixEl);
            });
          });
        }).observe(document.documentElement, {
          subtree: true, childList: true, attributes: true, attributeFilter: ['src', 'href']
        });
      })();
    </script>

    <title>Dune Weaver</title>

    <!-- Check for custom favicon -->
    <script>
      // Get base URL for active table (supports multi-table connections)
      (function() {
        var baseUrl = '';
        try {
          var stored = localStorage.getItem('duneweaver_tables');
          var activeId = localStorage.getItem('duneweaver_active_table');
          if (stored && activeId) {
            var data = JSON.parse(stored);
            var active = (data.tables || []).find(function(t) { return t.id === activeId; });
            if (active && !active.isCurrent && active.url && active.url !== window.location.origin) {
              baseUrl = active.url.replace(/\/$/, '');
            }
          }
        } catch (e) {}

        fetch(baseUrl + '/api/settings')
          .then(function(r) { return r.json(); })
          .then(function(settings) {
            if (settings.app && settings.app.custom_logo) {
              // Use generated icons with proper padding (not the raw uploaded logo)
              document.getElementById('favicon-ico').href = baseUrl + '/static/custom/favicon.ico';
              document.getElementById('apple-touch-icon').href = baseUrl + '/static/custom/apple-touch-icon.png';
            }
            if (settings.app && settings.app.name) {
              document.title = settings.app.name;
              // Also update PWA title
              var appTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
              if (appTitleMeta) appTitleMeta.content = settings.app.name;
            }
          })
          .catch(function() {});
      })();
    </script>
